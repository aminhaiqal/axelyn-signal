name: CI and VPS deploy

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axelyn-signal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy main to the VPS
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Validate SSH configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          required=(VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              printf 'Missing required production secret: %s\n' "$name" >&2
              exit 1
            fi
          done

          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || {
            printf 'VPS_PORT must be numeric.\n' >&2
            exit 1
          }
          ((VPS_PORT >= 1 && VPS_PORT <= 65535)) || {
            printf 'VPS_PORT must be between 1 and 65535.\n' >&2
            exit 1
          }
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || {
            printf 'VPS_USER is not a valid Linux account name.\n' >&2
            exit 1
          }
          [[ "$VPS_HOST" != -* && ! "$VPS_HOST" =~ [[:space:]] ]] || {
            printf 'VPS_HOST is not valid.\n' >&2
            exit 1
          }

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/axelyn_deploy"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/axelyn_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy the validated commit over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          AXELYN_COMPOSE_PROFILE: ${{ vars.AXELYN_COMPOSE_PROFILE || 'tunnel' }}
        run: |
          set -Eeuo pipefail

          common_options=(
            -i "$HOME/.ssh/axelyn_deploy"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )

          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive_name="axelyn-signal-${release_id}.tar.gz"
          remote_script_name="axelyn-remote-deploy-${release_id}.sh"
          remote_incoming_dir="/opt/axelyn-signal/incoming"
          archive_path="$RUNNER_TEMP/$archive_name"
          remote_script_path="$RUNNER_TEMP/$remote_script_name"

          git archive --format=tar.gz --output="$archive_path" "$GITHUB_SHA"
          cp scripts/remote-deploy-vps.sh "$remote_script_path"

          scp "${common_options[@]}" -P "$VPS_PORT" \
            "$archive_path" "$remote_script_path" \
            "$VPS_USER@$VPS_HOST:$remote_incoming_dir/"

          printf -v remote_command 'bash %q %q %q %q %q' \
            "$remote_incoming_dir/$remote_script_name" \
            "$GITHUB_SHA" \
            "$AXELYN_COMPOSE_PROFILE" \
            "$remote_incoming_dir/$archive_name" \
            "$release_id"

          ssh "${common_options[@]}" -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" "$remote_command"
